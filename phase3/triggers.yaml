apiVersion: v1
kind: Pod
metadata:
  name: crash-test
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo 'ERROR: cannot connect to database' >&2; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: badimage-test
spec:
  containers:
  - name: app
    image: nginx:does-not-exist
---
apiVersion: v1
kind: Pod
metadata:
  name: oom-test
spec:
  containers:
  - name: hog
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "100M", "--vm-hang", "1"]
    resources:
      limits:
        memory: "50Mi"
